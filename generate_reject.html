<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Laporan Reject Pilihan & Proses</title>
    <!-- Favicon Standar & Favicon Khusus HP -->
    <link rel="icon" type="image/png" href="97799.png">
    <link rel="apple-touch-icon" href="97799.png">
    <!-- Gunakan SheetJS v0.20.3 agar pembacaan XML LibreOffice (.ods) & Excel (.xlsx) 100% identik -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1, h2, h3, h4 { color: #2c3e50; }
        h1 { border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-bottom: 20px; }
        .upload-section {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .file-box {
            flex: 1;
            min-width: 300px;
            padding: 20px;
            border: 2px dashed #bdc3c7;
            border-radius: 6px;
            text-align: center;
            background-color: #fafafa;
        }
        .file-box label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #2c3e50;
        }
        .file-hint {
            display: block;
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 12px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover { background-color: #2980b9; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            margin-top: 10px;
            font-size: 14px;
        }
        th, td {
            padding: 10px 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #34495e;
            color: white;
            white-space: nowrap;
        }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .high-reject { color: #e74c3c; font-weight: bold; }
        .report-block { display: none; margin-top: 40px; border-top: 2px solid #ecf0f1; padding-top: 20px; }
        .error-box {
            background-color: #fdecea;
            color: #c0392b;
            padding: 15px;
            border-left: 5px solid #e74c3c;
            border-radius: 4px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Aplikasi Laporan Agregasi Reject Mingguan</h1>
    
    <div class="upload-section">
        <div class="file-box">
            <label for="filePilihan">Upload File Reject PILIHAN</label>
            <span class="file-hint">Format didukung: Excel (.xlsx, .xls) & LibreOffice (.ods)</span>
            <input type="file" id="filePilihan" accept=".xlsx, .xls, .ods">
        </div>
        <div class="file-box">
            <label for="fileProses">Upload File Reject PROSES</label>
            <span class="file-hint">Format didukung: Excel (.xlsx, .xls) & LibreOffice (.ods)</span>
            <input type="file" id="fileProses" accept=".xlsx, .xls, .ods">
        </div>
    </div>

    <button onclick="generateLaporan()">Generate Laporan</button>

    <div id="outputArea" class="report-block"></div>
</div>

<script>
    const CUSTOM_ORDER = [
        "LIPSTICK",
        "COMPACT",
        "POWDER",
        "JAR",
        "PENCIL UNIT",
        "MASCARA/EYELINER",
        "LIPGLOSS",
        "LIPBALM",
        "COVER"
    ];

    function getSortIndex(type) {
        const idx = CUSTOM_ORDER.indexOf(type);
        return idx === -1 ? 999 : idx;
    }

    // Pastikan SheetJS v0.20.3 aktif (mengatasi bug .ods jika di aplikasi utama masih termuat v0.18.5)
    function ensureModernXLSX() {
        return new Promise((resolve, reject) => {
            if (typeof XLSX !== 'undefined' && XLSX.version && !XLSX.version.startsWith('0.18')) {
                resolve();
                return;
            }
            const script = document.createElement('script');
            script.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
            script.onload = () => resolve();
            script.onerror = () => {
                if (typeof XLSX !== 'undefined') resolve();
                else reject('Gagal memuat pustaka pembaca Excel/ODS.');
            };
            document.head.appendChild(script);
        });
    }

    // Standarisasi Tipe Produk + Deteksi Kontekstual Pencil Unit
    function cleanProductType(rawType, rawName, sectionHint) {
        let t = String(rawType || '').toUpperCase().replace(/\s+/g, ' ').trim();
        let nameUpper = String(rawName || '').toUpperCase().trim();

        // 1. Kunci sebagai PENCIL UNIT jika tertulis Pencil, berada di sub-tabel Pencil Unit, atau kode produk seri 51xx
        if (t.includes('PENCIL') || t.includes('PENSIL') || 
            sectionHint === 'PENCIL UNIT' || 
            /^51\d{2}/.test(nameUpper)) {
            return 'PENCIL UNIT';
        }

        if (!t) return '';

        // 2. Deteksi segala variasi typo Mascara / Eyeliner
        if (t.includes('MASC') || t.includes('MASAC') || t.includes('MSCR') || 
            t.includes('EYEL') || t.includes('EYE L') || t.includes('LINER') || 
            t.startsWith('MAS')) {
            return 'MASCARA/EYELINER';
        }

        // 3. Deteksi Lipstick
        if (t.includes('LIPST') || t.includes('LIP ST') || t.includes('LIPT') || t.includes('LPST')) {
            return 'LIPSTICK';
        }

        // 4. Deteksi Compact
        if (t.includes('COMP') || t.includes('COMAP') || t.includes('CMP') || t.includes('KOMP')) {
            return 'COMPACT';
        }

        // 5. Deteksi Powder
        if (t.includes('POWD') || t.includes('PWDR') || t.includes('POWR')) {
            return 'POWDER';
        }

        // 6. Deteksi Jar
        if (t.startsWith('JA') || t === 'JR') {
            return 'JAR';
        }

        // 7. Deteksi Lipgloss
        if (t.includes('GLOS') || t.includes('GLSS') || t.includes('LIPG')) {
            return 'LIPGLOSS';
        }

        // 8. Deteksi Lipbalm
        if (t.includes('BALM') || t.includes('BLAM') || t.includes('BLM') || t.includes('LIPB')) {
            return 'LIPBALM';
        }

        // 9. Deteksi Cover
        if (t.includes('COVER') || t.includes('CVR')) {
            return 'COVER';
        }

        return t;
    }

    function cleanProductName(rawName, fallbackJobOrder) {
        let cleaned = String(rawName || '').replace(/\s+/g, ' ').trim();
        if (!cleaned && fallbackJobOrder) {
            return "(Tanpa Nama - JO: " + String(fallbackJobOrder).trim() + ")";
        }
        return cleaned || "Tanpa Nama Produk";
    }

    // Pembaca nilai angka yang aman untuk format Indonesia/Inggris di .ods maupun .xlsx
    function parseNumericCell(cellVal) {
        if (typeof cellVal === 'number') return isNaN(cellVal) ? 0 : cellVal;
        if (cellVal === null || cellVal === undefined || cellVal === '') return 0;
        let str = String(cellVal).trim();
        if (!str || str.includes('%')) return 0;

        // Jika format seperti "25.000" (titik sebagai ribuan) vs "25,000" (koma sebagai ribuan)
        if (/^\d{1,3}(\.\d{3})+$/.test(str)) {
            str = str.replace(/\./g, '');
        } else {
            str = str.replace(/,/g, '');
        }
        let parsed = parseFloat(str);
        return isNaN(parsed) ? 0 : parsed;
    }

    // Membaca matriks sheet langsung berdasarkan koordinat sel agar tidak terdampak bug array .ods
    function sheetToDenseMatrix(sheet, maxRows = 500, maxCols = 32) {
        if (!sheet || !sheet['!ref']) return [];
        const range = XLSX.utils.decode_range(sheet['!ref']);
        const endRow = Math.min(range.e.r, maxRows);
        const endCol = Math.min(range.e.c, maxCols);

        const matrix = [];
        for (let r = 0; r <= endRow; r++) {
            const row = new Array(endCol + 1).fill("");
            for (let c = 0; c <= endCol; c++) {
                const cellAddress = XLSX.utils.encode_cell({ r, c });
                const cell = sheet[cellAddress];
                if (cell !== undefined && cell !== null) {
                    // Prioritaskan nilai numerik/raw (cell.v) dibanding teks terformat
                    if (cell.v !== undefined && cell.v !== null) {
                        row[c] = cell.v;
                    } else if (cell.w !== undefined && cell.w !== null) {
                        row[c] = cell.w;
                    }
                }
            }
            matrix.push(row);
        }
        return matrix;
    }

    // Deteksi apakah blok sub-tabel saat ini adalah blok khusus PENCIL UNIT
    function detectSectionHint(matrix, headerRowIdx, maxRow) {
        for (let r = headerRowIdx + 1; r < Math.min(headerRowIdx + 20, maxRow); r++) {
            const rowStr = (matrix[r] || []).map(x => String(x || '').toUpperCase()).join(' ');
            // Jika sub-header memiliki komponen NOZZLE atau baris TOTAL menyebut PENCIL UNIT
            if (rowStr.includes('NOZZLE') || rowStr.includes('PENCIL UNIT') || rowStr.includes('PENCILUNIT')) {
                return 'PENCIL UNIT';
            }
            if (rowStr.includes('TYPE') && rowStr.includes('QTY ORDER')) {
                break; // Sudah masuk ke sub-tabel berikutnya
            }
        }
        return '';
    }

    async function generateLaporan() {
        const outputArea = document.getElementById('outputArea');
        outputArea.style.display = 'block';

        const filePilihan = document.getElementById('filePilihan').files[0];
        const fileProses = document.getElementById('fileProses').files[0];

        if (!filePilihan && !fileProses) {
            outputArea.innerHTML = `<div class="error-box">Harap pilih minimal satu file terlebih dahulu (.xlsx, .xls, atau .ods).</div>`;
            return;
        }

        outputArea.innerHTML = '<h2>Memproses data...</h2>';

        try {
            await ensureModernXLSX();
            let promises = [];
            if (filePilihan) promises.push(processFile(filePilihan, 'PILIHAN'));
            if (fileProses) promises.push(processFile(fileProses, 'PROSES'));

            const results = await Promise.all(promises);
            outputArea.innerHTML = '';
            results.forEach(res => renderReport(res.jenis, res.fileName, res.data));
        } catch (err) {
            outputArea.innerHTML = `<div class="error-box"><strong>Gagal Memproses File:</strong><br>${err}</div>`;
        }
    }

    function processFile(file, jenis) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();

            reader.onerror = function() {
                reject(`File <strong>"${file.name}"</strong> tidak dapat dibaca oleh browser. Pastikan file tidak sedang dikunci/terbuka di program Excel atau LibreOffice.`);
            };

            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array', cellFormula: false, cellNF: false });
                    let rawData = [];

                    workbook.SheetNames.forEach(sheetName => {
                        const sheet = workbook.Sheets[sheetName];
                        const matrix = sheetToDenseMatrix(sheet, 500, 32);
                        if (matrix.length === 0) return;

                        let typeIdx = -1, nameIdx = -1, jobIdx = -1, orderIdx = -1;
                        let currentSectionHint = '';

                        for (let r = 0; r < matrix.length; r++) {
                            const row = matrix[r];
                            const upperRow = row.map(c => String(c || '').replace(/\s+/g, ' ').trim().toUpperCase());

                            // Deteksi setiap kali bertemu baris Header Tabel / Sub-Tabel
                            if (upperRow.includes('TYPE') && upperRow.includes('QTY ORDER')) {
                                typeIdx  = upperRow.indexOf('TYPE');
                                nameIdx  = upperRow.indexOf('NAMA PRODUK');
                                jobIdx   = upperRow.indexOf('JOB ORDER');
                                orderIdx = upperRow.indexOf('QTY ORDER');
                                currentSectionHint = detectSectionHint(matrix, r, matrix.length);
                                continue;
                            }

                            if (typeIdx === -1 || orderIdx === -1) continue;

                            const firstCol = upperRow[0] || '';
                            const rawName  = nameIdx !== -1 ? String(row[nameIdx] || '').trim() : '';
                            const rawJob   = jobIdx !== -1 ? String(row[jobIdx] || '').trim() : '';
                            const rawType  = String(row[typeIdx] || '').trim();
                            const rawOrder = row[orderIdx];

                            // Abaikan baris sub-header atau baris TOTAL
                            if (!rawType && !rawName) continue;
                            if (firstCol.includes('TOTAL') || firstCol.includes('TOTA ') ||
                                rawName.toUpperCase().includes('TOTAL') || rawType.toUpperCase().includes('TOTAL')) {
                                continue;
                            }
                            if (upperRow[typeIdx] === 'TYPE' || upperRow[orderIdx] === 'QTY ORDER') continue;

                            // Abaikan baris template kosong yang tidak punya Nama Produk sekaligus tidak punya Job Order
                            if (!rawName && !rawJob) continue;

                            const order = parseNumericCell(rawOrder);
                            if (order <= 0) continue;

                            // Hitung Total Reject (Qty) berdasarkan struktur kolom di kanan QTY ORDER
                            let rejectQty = 0;
                            if (jenis === 'PROSES') {
                                // Reject Proses selalu berada tepat 1 kolom di kanan QTY ORDER (Kolom H)
                                rejectQty = parseNumericCell(row[orderIdx + 1]);
                            } else {
                                // Reject Pilihan memiliki 9 pasang komponen (QTY, %) di kanan QTY ORDER:
                                // Indeks relatif: +1 (H), +3 (J), +5 (L), +7 (N), +9 (P), +11 (R), +13 (T), +15 (V), +17 (X)
                                for (let k = 0; k < 10; k++) {
                                    let colQty = orderIdx + 1 + (k * 2);
                                    if (colQty < row.length) {
                                        let val = parseNumericCell(row[colQty]);
                                        // Pastikan yang dijumlahkan adalah angka bulat/kuantitas reject (bukan desimal persentase)
                                        if (val > 0) rejectQty += Math.round(val);
                                    }
                                }
                            }

                            const finalType = cleanProductType(rawType, rawName, currentSectionHint);
                            if (!finalType) continue;

                            rawData.push({
                                type: finalType,
                                name: cleanProductName(rawName, rawJob),
                                order: order,
                                reject: rejectQty
                            });
                        }
                    });

                    resolve({ jenis, fileName: file.name, data: rawData });
                } catch (error) {
                    reject(`Terjadi kesalahan struktur pada file <strong>"${file.name}"</strong>: ${error.message || error}`);
                }
            };

            reader.readAsArrayBuffer(file);
        });
    }

    function renderReport(jenis, fileName, rawData) {
        const outputArea = document.getElementById('outputArea');

        if (!rawData || rawData.length === 0) {
            outputArea.innerHTML += `<div class="error-box"><strong>Laporan Reject ${jenis} (${fileName}):</strong> Tidak ditemukan baris data yang valid.</div>`;
            return;
        }

        let summaryMap = {};
        let detailMap = {};

        rawData.forEach(row => {
            if (!summaryMap[row.type]) summaryMap[row.type] = { order: 0, reject: 0 };
            summaryMap[row.type].order += row.order;
            summaryMap[row.type].reject += row.reject;

            let key = row.type + "|||" + row.name;
            if (!detailMap[key]) detailMap[key] = { type: row.type, name: row.name, order: 0, reject: 0 };
            detailMap[key].order += row.order;
            detailMap[key].reject += row.reject;
        });

        // 1. Render Tabel Keseluruhan per Tipe Produk
        let html = `<h2>Laporan Reject ${jenis} <span style="font-size:14px; font-weight:normal; color:#7f8c8d;">(${fileName})</span></h2>`;
        html += `<h3>1. Keseluruhan Reject per Tipe Produk</h3>`;
        html += `<table>
                    <thead>
                        <tr>
                            <th>Tipe Produk</th>
                            <th>Total Order</th>
                            <th>Total Reject (Qty)</th>
                            <th>Persentase Reject</th>
                        </tr>
                    </thead>
                    <tbody>`;
        
        let sortedTypes = Object.keys(summaryMap).sort((a, b) => getSortIndex(a) - getSortIndex(b));
        sortedTypes.forEach(type => {
            let s = summaryMap[type];
            let pct = s.order > 0 ? (s.reject / s.order) * 100 : 0;
            let cls = pct >= 2.5 ? 'class="high-reject"' : '';
            html += `<tr>
                        <td><strong>${type}</strong></td>
                        <td>${s.order.toLocaleString('id-ID')}</td>
                        <td>${s.reject.toLocaleString('id-ID')}</td>
                        <td ${cls}>${pct.toFixed(2)}%</td>
                     </tr>`;
        });
        html += `</tbody></table>`;

        // 2. Render Tabel Item Produk Reject Tertinggi (>= 2.5%)
        html += `<h3>2. Reject ${jenis} Tertinggi (&ge; 2,5%) per Tipe Produk</h3>`;
        
        let detailsArr = Object.values(detailMap).map(d => {
            d.pct = d.order > 0 ? (d.reject / d.order) * 100 : 0;
            return d;
        }).filter(d => d.pct >= 2.5);

        if (detailsArr.length === 0) {
            html += `<p><em>Tidak ada item produk dengan persentase reject mencapai 2,5% atau lebih.</em></p>`;
        } else {
            detailsArr.sort((a, b) => {
                let diff = getSortIndex(a.type) - getSortIndex(b.type);
                if (diff === 0) return b.pct - a.pct;
                return diff;
            });

            html += `<table>
                        <thead>
                            <tr>
                                <th>Tipe Produk</th>
                                <th>Nama Produk</th>
                                <th>Total Order</th>
                                <th>Total Reject (Qty)</th>
                                <th>Persentase Reject</th>
                            </tr>
                        </thead>
                        <tbody>`;
            
            detailsArr.forEach(item => {
                html += `<tr>
                            <td><strong>${item.type}</strong></td>
                            <td>${item.name}</td>
                            <td>${item.order.toLocaleString('id-ID')}</td>
                            <td class="high-reject">${item.reject.toLocaleString('id-ID')}</td>
                            <td class="high-reject">${item.pct.toFixed(2)}%</td>
                         </tr>`;
            });
            html += `</tbody></table>`;
        }
        
        html += `<hr style="margin: 40px 0; border-top: 2px solid #34495e;">`;
        outputArea.innerHTML += html;
    }
</script>

</body>
</html>
