<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Laporan Reject Pilihan & Proses</title>
  <!-- Favicon Standar & Favicon Khusus HP -->
    <link rel="icon" type="image/png" href="97799.png">
    <link rel="apple-touch-icon" href="97799.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1, h2, h3, h4 { color: #2c3e50; }
        h1 { border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-bottom: 20px; }
        .upload-section {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .file-box {
            flex: 1;
            min-width: 300px;
            padding: 20px;
            border: 2px dashed #bdc3c7;
            border-radius: 6px;
            text-align: center;
        }
        .file-box label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover { background-color: #2980b9; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            margin-top: 10px;
            font-size: 14px;
        }
        th, td {
            padding: 10px 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #34495e;
            color: white;
            white-space: nowrap;
        }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .high-reject { color: #e74c3c; font-weight: bold; }
        .report-block { display: none; margin-top: 40px; border-top: 2px solid #ecf0f1; padding-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Aplikasi Laporan Agregasi Reject Mingguan</h1>
    
    <div class="upload-section">
        <div class="file-box">
            <label for="filePilihan">Upload File Reject PILIHAN (.xlsx)</label>
            <input type="file" id="filePilihan" accept=".xlsx, .xls">
        </div>
        <div class="file-box">
            <label for="fileProses">Upload File Reject PROSES (.xlsx)</label>
            <input type="file" id="fileProses" accept=".xlsx, .xls">
        </div>
    </div>

    <button onclick="generateLaporan()">Generate Laporan</button>

    <div id="outputArea" class="report-block">
        <!-- Hasil akan dirender di sini -->
    </div>
</div>

<script>
    // Konfigurasi urutan spesifik tipe produk
    const CUSTOM_ORDER = [
        "LIPSTICK",
        "COMPACT",
        "POWDER",
        "JAR",
        "PENCIL UNIT",
        "MASCARA/EYELINER",
        "LIPGLOSS",
        "LIPBALM",
        "COVER"
    ];

    function getSortIndex(type) {
        const idx = CUSTOM_ORDER.indexOf(type);
        return idx === -1 ? 999 : idx; // Jika tipe tidak ada di list, taruh di urutan paling bawah
    }

    function generateLaporan() {
        const filePilihan = document.getElementById('filePilihan').files[0];
        const fileProses = document.getElementById('fileProses').files[0];
        const outputArea = document.getElementById('outputArea');
        outputArea.innerHTML = '<h2>Memproses data...</h2>';
        outputArea.style.display = 'block';

        let promises = [];
        
        if (filePilihan) promises.push(processFile(filePilihan, 'PILIHAN'));
        if (fileProses) promises.push(processFile(fileProses, 'PROSES'));

        if (promises.length === 0) {
            outputArea.innerHTML = '<p style="color:red;">Harap unggah minimal satu file terlebih dahulu.</p>';
            return;
        }

        Promise.all(promises).then(results => {
            outputArea.innerHTML = '';
            results.forEach(res => renderReport(res.jenis, res.data));
        }).catch(err => {
            outputArea.innerHTML = `<p style="color:red;">Terjadi kesalahan sistem: ${err}</p>`;
        });
    }

    function processFile(file, jenis) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    let rawData = [];

                    workbook.SheetNames.forEach(sheetName => {
                        const sheet = workbook.Sheets[sheetName];
                        const json = XLSX.utils.sheet_to_json(sheet, {header: 1});
                        
                        let startRow = -1;
                        for(let i=0; i<json.length; i++) {
                            const row = json[i] || [];
                            const upperRow = row.map(cell => String(cell).trim().toUpperCase());
                            if(upperRow.includes('TYPE') && upperRow.includes('QTY ORDER')) {
                                startRow = i;
                                break;
                            }
                        }

                        if(startRow !== -1) {
                            const headerRow = (json[startRow] || []).map(c => String(c).trim().toUpperCase());
                            const typeIdx = headerRow.indexOf('TYPE');
                            const nameIdx = headerRow.indexOf('NAMA PRODUK');
                            const orderIdx = headerRow.indexOf('QTY ORDER');

                            let qtyCols = [];
                            for(let offset = 1; offset <= 3; offset++) {
                                const subRow = (json[startRow + offset] || []).map(c => String(c).trim().toUpperCase());
                                for(let c = orderIdx + 1; c < subRow.length; c++) {
                                    if(subRow[c] === 'QTY') qtyCols.push(c);
                                }
                                if(qtyCols.length > 0) break;
                            }

                            for(let r = startRow + 4; r < json.length; r++) {
                                const row = json[r] || [];
                                let type = row[typeIdx];
                                let name = row[nameIdx] || "Unknown";
                                let order = row[orderIdx];

                                if(!type || !order || String(order).trim().toUpperCase() === 'TOTAL') continue;
                                
                                order = parseFloat(order);
                                if(isNaN(order)) continue;

                                let rejectQty = 0;
                                qtyCols.forEach(c => {
                                    let val = parseFloat(row[c]);
                                    if(!isNaN(val)) rejectQty += val;
                                });

                                // Standardisasi Penamaan Tipe
                                type = String(type).toUpperCase().trim();
                                if(type === 'COMAPCT') type = 'COMPACT';
                                if(type === 'LIPBLAM' || type === 'LIPBLAM ') type = 'LIPBALM';
                                if(type === 'MASCARA' || type === 'EYELINER') type = 'MASCARA/EYELINER';
                                if(type === 'PENCIL') type = 'PENCIL UNIT';

                                rawData.push({ type, name, order, reject: rejectQty });
                            }
                        }
                    });
                    resolve({ jenis, data: rawData });
                } catch (error) {
                    reject(error);
                }
            };
            reader.readAsArrayBuffer(file);
        });
    }

    function renderReport(jenis, rawData) {
        let summaryMap = {};
        let detailMap = {};

        rawData.forEach(row => {
            // Summary
            if (!summaryMap[row.type]) summaryMap[row.type] = { order: 0, reject: 0 };
            summaryMap[row.type].order += row.order;
            summaryMap[row.type].reject += row.reject;

            // Detail
            let key = row.type + "|||" + row.name;
            if (!detailMap[key]) detailMap[key] = { type: row.type, name: row.name, order: 0, reject: 0 };
            detailMap[key].order += row.order;
            detailMap[key].reject += row.reject;
        });

        // 1. Render Summary Table (Diurutkan berdasarkan CUSTOM_ORDER)
        let html = `<h2>Laporan Reject ${jenis}</h2>`;
        html += `<h3>1. Keseluruhan Reject per Tipe Produk</h3>`;
        html += `<table>
                    <thead>
                        <tr>
                            <th>Tipe Produk</th>
                            <th>Total Order</th>
                            <th>Total Reject</th>
                            <th>Persentase</th>
                        </tr>
                    </thead>
                    <tbody>`;
        
        let sortedTypes = Object.keys(summaryMap).sort((a, b) => getSortIndex(a) - getSortIndex(b));
        sortedTypes.forEach(type => {
            let s = summaryMap[type];
            let pct = s.order > 0 ? (s.reject / s.order) * 100 : 0;
            html += `<tr>
                        <td><strong>${type}</strong></td>
                        <td>${s.order.toLocaleString('id-ID')}</td>
                        <td>${s.reject.toLocaleString('id-ID')}</td>
                        <td>${pct.toFixed(2)}%</td>
                     </tr>`;
        });
        html += `</tbody></table>`;

        // 2. Render Detail Table (>= 2.5%) (Diurutkan berdasarkan CUSTOM_ORDER, lalu Persentase)
        html += `<h3>2. Item Produk Reject Tertinggi (&ge; 2.5%)</h3>`;
        
        let detailsArr = Object.values(detailMap).map(d => {
            d.pct = d.order > 0 ? (d.reject / d.order) * 100 : 0;
            return d;
        }).filter(d => d.pct >= 2.5);

        if(detailsArr.length === 0) {
            html += `<p><em>Tidak ada item dengan persentase reject mencapai 2.5% atau lebih.</em></p>`;
        } else {
            // Sorting Detail Table
            detailsArr.sort((a, b) => {
                let diff = getSortIndex(a.type) - getSortIndex(b.type);
                if (diff === 0) {
                    return b.pct - a.pct; // Jika tipenya sama, urutkan dari persen tertinggi
                }
                return diff;
            });

            html += `<table>
                        <thead>
                            <tr>
                                <th>Tipe Produk</th>
                                <th>Nama Produk</th>
                                <th>Total Order</th>
                                <th>Total Reject</th>
                                <th>Persentase</th>
                            </tr>
                        </thead>
                        <tbody>`;
            
            detailsArr.forEach(item => {
                html += `<tr>
                            <td><strong>${item.type}</strong></td>
                            <td>${item.name}</td>
                            <td>${item.order.toLocaleString('id-ID')}</td>
                            <td class="high-reject">${item.reject.toLocaleString('id-ID')}</td>
                            <td class="high-reject">${item.pct.toFixed(2)}%</td>
                         </tr>`;
            });
            html += `</tbody></table>`;
        }
        
        html += `<hr style="margin: 40px 0; border-top: 2px solid #34495e;">`;
        document.getElementById('outputArea').innerHTML += html;
    }
</script>

</body>
</html>
