<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Laporan Reject Pilihan & Proses</title>
    <!-- Favicon Standar & Favicon Khusus HP -->
    <link rel="icon" type="image/png" href="97799.png">
    <link rel="apple-touch-icon" href="97799.png">

    <!-- Pustaka Utama SheetJS + Fallback CDN jika diblokir jaringan -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" 
            onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1, h2, h3, h4 { color: #2c3e50; }
        h1 { border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-bottom: 20px; }
        .upload-section {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .file-box {
            flex: 1;
            min-width: 300px;
            padding: 20px;
            border: 2px dashed #bdc3c7;
            border-radius: 6px;
            text-align: center;
            background-color: #fafafa;
        }
        .file-box label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #2c3e50;
        }
        .file-hint {
            display: block;
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 12px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover { background-color: #2980b9; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            margin-top: 10px;
            font-size: 14px;
        }
        th, td {
            padding: 10px 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #34495e;
            color: white;
            white-space: nowrap;
        }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .high-reject { color: #e74c3c; font-weight: bold; }
        .report-block { display: none; margin-top: 40px; border-top: 2px solid #ecf0f1; padding-top: 20px; }
        .error-box {
            background-color: #fdecea;
            color: #c0392b;
            padding: 15px;
            border-left: 5px solid #e74c3c;
            border-radius: 4px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Aplikasi Laporan Agregasi Reject Mingguan</h1>
    
    <div class="upload-section">
        <div class="file-box">
            <label for="filePilihan">Upload File Reject PILIHAN</label>
            <span class="file-hint">Format didukung: Excel (.xlsx, .xls) & LibreOffice (.ods)</span>
            <input type="file" id="filePilihan" accept=".xlsx, .xls, .ods">
        </div>
        <div class="file-box">
            <label for="fileProses">Upload File Reject PROSES</label>
            <span class="file-hint">Format didukung: Excel (.xlsx, .xls) & LibreOffice (.ods)</span>
            <input type="file" id="fileProses" accept=".xlsx, .xls, .ods">
        </div>
    </div>

    <button onclick="generateLaporan()">Generate Laporan</button>

    <div id="outputArea" class="report-block"></div>
</div>

<script>
    const CUSTOM_ORDER = [
        "LIPSTICK",
        "COMPACT",
        "POWDER",
        "JAR",
        "PENCIL UNIT",
        "MASCARA/EYELINER",
        "LIPGLOSS",
        "LIPBALM",
        "COVER"
    ];

    function getSortIndex(type) {
        const idx = CUSTOM_ORDER.indexOf(type);
        return idx === -1 ? 999 : idx;
    }

    function cleanProductType(rawType) {
        let t = String(rawType || '').toUpperCase().replace(/\s+/g, ' ').trim();
        if (t === 'COMAPCT') return 'COMPACT';
        if (t === 'LIPBLAM') return 'LIPBALM';
        if (t === 'LIPGLOS') return 'LIPGLOSS';
        if (t === 'LIPSTIK') return 'LIPSTICK';
        if (t === 'MASCARA' || t === 'MASACARA' || t === 'MASCRA' || t === 'EYELINER') return 'MASCARA/EYELINER';
        if (t === 'PENCIL') return 'PENCIL UNIT';
        return t;
    }

    function cleanProductName(rawName, fallbackJobOrder) {
        let cleaned = String(rawName || '').replace(/\s+/g, ' ').trim();
        if (!cleaned && fallbackJobOrder) {
            return "(Tanpa Nama - JO: " + String(fallbackJobOrder).trim() + ")";
        }
        return cleaned || "Tanpa Nama Produk";
    }

    function generateLaporan() {
        const outputArea = document.getElementById('outputArea');
        outputArea.style.display = 'block';

        if (typeof XLSX === 'undefined') {
            outputArea.innerHTML = `<div class="error-box"><strong>Gagal Memuat Komponen Pembaca Excel:</strong> Pastikan komputer Anda terhubung ke internet saat membuka halaman ini agar pustaka SheetJS dapat dimuat.</div>`;
            return;
        }

        const filePilihan = document.getElementById('filePilihan').files[0];
        const fileProses = document.getElementById('fileProses').files[0];

        if (!filePilihan && !fileProses) {
            outputArea.innerHTML = `<div class="error-box">Harap pilih minimal satu file terlebih dahulu (.xlsx, .xls, atau .ods).</div>`;
            return;
        }

        outputArea.innerHTML = '<h2>Memproses data...</h2>';

        setTimeout(() => {
            let promises = [];
            if (filePilihan) promises.push(processFile(filePilihan, 'PILIHAN'));
            if (fileProses) promises.push(processFile(fileProses, 'PROSES'));

            Promise.all(promises).then(results => {
                outputArea.innerHTML = '';
                results.forEach(res => renderReport(res.jenis, res.fileName, res.data));
            }).catch(err => {
                outputArea.innerHTML = `<div class="error-box"><strong>Gagal Memproses File:</strong><br>${err}</div>`;
            });
        }, 50);
    }

    function processFile(file, jenis) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();

            reader.onerror = function() {
                reject(`File <strong>"${file.name}"</strong> tidak dapat dibaca oleh browser. <br>
                        <em>Solusi: Tutup terlebih dahulu file "${file.name}" jika sedang terbuka di aplikasi Microsoft Excel, lalu klik tombol Browse untuk memilih ulang file tersebut.</em>`);
            };

            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array', sheetRows: 3000 });
                    let rawData = [];

                    workbook.SheetNames.forEach(sheetName => {
                        const sheet = workbook.Sheets[sheetName];
                        if (!sheet || !sheet['!ref']) return;

                        // Pangkas kolom "hantu" XFD menjadi maksimal 40 kolom (Kolom A - AN)
                        let range = XLSX.utils.decode_range(sheet['!ref']);
                        if (range.e.c > 40) range.e.c = 40;
                        if (range.e.r > 3000) range.e.r = 3000;
                        sheet['!ref'] = XLSX.utils.encode_range(range);

                        const json = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
                        
                        let startRow = -1;
                        const maxScanHeader = Math.min(json.length, 30);
                        for (let i = 0; i < maxScanHeader; i++) {
                            const row = json[i] || [];
                            const upperRow = row.map(cell => String(cell).replace(/\s+/g, ' ').trim().toUpperCase());
                            if (upperRow.includes('TYPE') && upperRow.includes('QTY ORDER')) {
                                startRow = i;
                                break;
                            }
                        }

                        if (startRow !== -1) {
                            const headerRow = (json[startRow] || []).map(c => String(c).replace(/\s+/g, ' ').trim().toUpperCase());
                            const typeIdx = headerRow.indexOf('TYPE');
                            const nameIdx = headerRow.indexOf('NAMA PRODUK');
                            const jobIdx  = headerRow.indexOf('JOB ORDER');
                            const orderIdx = headerRow.indexOf('QTY ORDER');

                            let qtyCols = [];
                            for (let offset = 1; offset <= 4; offset++) {
                                if (startRow + offset >= json.length) break;
                                const subRow = (json[startRow + offset] || []).map(c => String(c).trim().toUpperCase());
                                for (let c = orderIdx + 1; c < subRow.length; c++) {
                                    if (subRow[c] === 'QTY') qtyCols.push(c);
                                }
                                if (qtyCols.length > 0) break;
                            }

                            for (let r = startRow + 1; r < json.length; r++) {
                                const row = json[r] || [];
                                const firstCol = String(row[0] || '').toUpperCase();
                                const rawName  = String(row[nameIdx] || '');
                                const rawType  = String(row[typeIdx] || '').trim();
                                const rawOrder = row[orderIdx];

                                if (!rawType || rawOrder === '' || rawOrder === null || rawOrder === undefined) continue;
                                if (firstCol.includes('TOTAL') || rawName.toUpperCase().includes('TOTAL') || rawType.toUpperCase().includes('TOTAL')) continue;
                                if (rawType.toUpperCase() === 'TYPE') continue;

                                let order = typeof rawOrder === 'number' ? rawOrder : parseFloat(String(rawOrder).replace(/,/g, ''));
                                if (isNaN(order) || order <= 0) continue;

                                let rejectQty = 0;
                                qtyCols.forEach(c => {
                                    let cellVal = row[c];
                                    let val = typeof cellVal === 'number' ? cellVal : parseFloat(String(cellVal).replace(/,/g, ''));
                                    if (!isNaN(val) && val > 0) rejectQty += val;
                                });

                                rawData.push({
                                    type: cleanProductType(rawType),
                                    name: cleanProductName(rawName, jobIdx !== -1 ? row[jobIdx] : ''),
                                    order: order,
                                    reject: rejectQty
                                });
                            }
                        }
                    });

                    resolve({ jenis, fileName: file.name, data: rawData });
                } catch (error) {
                    reject(`Terjadi kesalahan struktur pada file <strong>"${file.name}"</strong>: ${error.message || error}`);
                }
            };

            reader.readAsArrayBuffer(file);
        });
    }

    function renderReport(jenis, fileName, rawData) {
        const outputArea = document.getElementById('outputArea');

        if (!rawData || rawData.length === 0) {
            outputArea.innerHTML += `<div class="error-box"><strong>Laporan Reject ${jenis} (${fileName}):</strong> Tidak ditemukan baris data yang valid. Pastikan terdapat kolom header <b>TYPE</b> dan <b>QTY ORDER</b> di dalam sheet.</div>`;
            return;
        }

        let summaryMap = {};
        let detailMap = {};

        rawData.forEach(row => {
            if (!summaryMap[row.type]) summaryMap[row.type] = { order: 0, reject: 0 };
            summaryMap[row.type].order += row.order;
            summaryMap[row.type].reject += row.reject;

            let key = row.type + "|||" + row.name;
            if (!detailMap[key]) detailMap[key] = { type: row.type, name: row.name, order: 0, reject: 0 };
            detailMap[key].order += row.order;
            detailMap[key].reject += row.reject;
        });

        // 1. Render Tabel Keseluruhan per Tipe Produk (Tanpa Kolom No)
        let html = `<h2>Laporan Reject ${jenis} <span style="font-size:14px; font-weight:normal; color:#7f8c8d;">(${fileName})</span></h2>`;
        html += `<h3>1. Keseluruhan Reject per Tipe Produk</h3>`;
        html += `<table>
                    <thead>
                        <tr>
                            <th>Tipe Produk</th>
                            <th>Total Order</th>
                            <th>Total Reject (Qty)</th>
                            <th>Persentase Reject</th>
                        </tr>
                    </thead>
                    <tbody>`;
        
        let sortedTypes = Object.keys(summaryMap).sort((a, b) => getSortIndex(a) - getSortIndex(b));
        sortedTypes.forEach(type => {
            let s = summaryMap[type];
            let pct = s.order > 0 ? (s.reject / s.order) * 100 : 0;
            let cls = pct >= 2.5 ? 'class="high-reject"' : '';
            html += `<tr>
                        <td><strong>${type}</strong></td>
                        <td>${s.order.toLocaleString('id-ID')}</td>
                        <td>${s.reject.toLocaleString('id-ID')}</td>
                        <td ${cls}>${pct.toFixed(2)}%</td>
                     </tr>`;
        });
        html += `</tbody></table>`;

        // 2. Render Tabel Item Produk Reject Tertinggi (>= 2.5%) (Tanpa Kolom No)
        html += `<h3>2. Reject ${jenis} Tertinggi (&ge; 2,5%) per Tipe Produk</h3>`;
        
        let detailsArr = Object.values(detailMap).map(d => {
            d.pct = d.order > 0 ? (d.reject / d.order) * 100 : 0;
            return d;
        }).filter(d => d.pct >= 2.5);

        if (detailsArr.length === 0) {
            html += `<p><em>Tidak ada item produk dengan persentase reject mencapai 2,5% atau lebih.</em></p>`;
        } else {
            detailsArr.sort((a, b) => {
                let diff = getSortIndex(a.type) - getSortIndex(b.type);
                if (diff === 0) return b.pct - a.pct;
                return diff;
            });

            html += `<table>
                        <thead>
                            <tr>
                                <th>Tipe Produk</th>
                                <th>Nama Produk</th>
                                <th>Total Order</th>
                                <th>Total Reject (Qty)</th>
                                <th>Persentase Reject</th>
                            </tr>
                        </thead>
                        <tbody>`;
            
            detailsArr.forEach(item => {
                html += `<tr>
                            <td><strong>${item.type}</strong></td>
                            <td>${item.name}</td>
                            <td>${item.order.toLocaleString('id-ID')}</td>
                            <td class="high-reject">${item.reject.toLocaleString('id-ID')}</td>
                            <td class="high-reject">${item.pct.toFixed(2)}%</td>
                         </tr>`;
            });
            html += `</tbody></table>`;
        }
        
        html += `<hr style="margin: 40px 0; border-top: 2px solid #34495e;">`;
        outputArea.innerHTML += html;
    }
</script>

</body>
</html>
